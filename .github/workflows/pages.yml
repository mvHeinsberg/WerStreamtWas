name: Build & Deploy Streamguide

on:
  schedule:
    - cron: '*/30 * * * *'   # alle 30 Minuten (GitHub garantiert keine exakte Punktlandung)
  workflow_dispatch: {}       # manueller "Run workflow"-Button in der Actions-Ansicht
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sendeplan erzeugen (data/schedule.json)
        run: node build.js

      - name: Statisches Bundle zusammenstellen
        run: |
          mkdir -p dist
          cp public/index.html dist/index.html
          cp data/schedule.json dist/schedule.json

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
